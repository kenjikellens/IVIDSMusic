<div class="artist-page page-container fade-in">
    <!-- Hero Section -->
    <div class="artist-hero">
        <div class="hero-bg">
            <div class="blob blob-1"></div>
            <div class="blob blob-2"></div>
            <div class="blob blob-3"></div>
            <div class="blob blob-4"></div>
        </div>
        <div class="artist-hero-content">
            <div class="artist-avatar-wrapper">
                <div class="ivids-loader poster-loader" id="artist-avatar-loader"></div>
                <img id="artist-avatar" src="" alt="" class="artist-avatar" style="opacity: 0;">
            </div>
            <div class="artist-info-wrapper">
                <div class="artist-meta-row">
                    <span class="artist-type-label" data-i18n="view_artist">Artist</span>
                </div>
                <h1 id="artist-name" class="artist-name">—</h1>
                <div class="artist-stats" id="artist-stats">
                    <span id="artist-fans">-- fans</span>
                    <span class="stat-dot">•</span>
                    <span id="artist-albums-count">-- albums</span>
                </div>
                <div class="artist-actions">
                    <button class="btn btn-primary" id="play-artist-btn" disabled>
                        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                        <span data-i18n="play_top_track">Play Top Track</span>
                    </button>
                    <button class="btn btn-secondary" id="shuffle-artist-btn" disabled>
                        <img src="svg/shuffle.svg" alt="" class="btn-icon" style="filter:brightness(0) invert(1);">
                        <span data-i18n="shuffle">Shuffle</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Content Sections (Exact match of song.html category structure and order) -->
    <div class="artist-content" id="artist-content">
        <!-- 1. Albums from Artist Row -->
        <div id="artist-albums-container" class="row-scroll-wrapper">
            <div class="row-header">
                <h2 id="artist-albums-title" class="row-title">Albums</h2>
            </div>
            <div class="scroll-row" id="artist-albums">
                <div class="music-card card-placeholder container-hover-effect">
                    <div class="card-image-box"><div class="ivids-loader"><img src="svg/loader.svg" alt="Loading" class="ivids-loader-img"></div></div>
                    <div class="card-info-box"><div class="card-title"></div><div class="card-artist"></div></div>
                </div>
                <div class="music-card card-placeholder container-hover-effect">
                    <div class="card-image-box"><div class="ivids-loader"><img src="svg/loader.svg" alt="Loading" class="ivids-loader-img"></div></div>
                    <div class="card-info-box"><div class="card-title"></div><div class="card-artist"></div></div>
                </div>
                <div class="music-card card-placeholder container-hover-effect">
                    <div class="card-image-box"><div class="ivids-loader"><img src="svg/loader.svg" alt="Loading" class="ivids-loader-img"></div></div>
                    <div class="card-info-box"><div class="card-title"></div><div class="card-artist"></div></div>
                </div>
                <div class="music-card card-placeholder container-hover-effect">
                    <div class="card-image-box"><div class="ivids-loader"><img src="svg/loader.svg" alt="Loading" class="ivids-loader-img"></div></div>
                    <div class="card-info-box"><div class="card-title"></div><div class="card-artist"></div></div>
                </div>
            </div>
        </div>

        <!-- 2. Most Popular Songs Row -->
        <div id="artist-popular-container" class="row-scroll-wrapper">
            <div class="row-header">
                <h2 id="artist-popular-title" class="row-title">Most Popular Songs</h2>
            </div>
            <div class="scroll-row" id="artist-popular-tracks">
                <div class="music-card card-placeholder container-hover-effect">
                    <div class="card-image-box"><div class="ivids-loader"><img src="svg/loader.svg" alt="Loading" class="ivids-loader-img"></div></div>
                    <div class="card-info-box"><div class="card-title"></div><div class="card-artist"></div></div>
                </div>
                <div class="music-card card-placeholder container-hover-effect">
                    <div class="card-image-box"><div class="ivids-loader"><img src="svg/loader.svg" alt="Loading" class="ivids-loader-img"></div></div>
                    <div class="card-info-box"><div class="card-title"></div><div class="card-artist"></div></div>
                </div>
                <div class="music-card card-placeholder container-hover-effect">
                    <div class="card-image-box"><div class="ivids-loader"><img src="svg/loader.svg" alt="Loading" class="ivids-loader-img"></div></div>
                    <div class="card-info-box"><div class="card-title"></div><div class="card-artist"></div></div>
                </div>
                <div class="music-card card-placeholder container-hover-effect">
                    <div class="card-image-box"><div class="ivids-loader"><img src="svg/loader.svg" alt="Loading" class="ivids-loader-img"></div></div>
                    <div class="card-info-box"><div class="card-title"></div><div class="card-artist"></div></div>
                </div>
            </div>
        </div>

        <!-- 3. Most Trending Songs Row -->
        <div id="artist-trending-container" class="row-scroll-wrapper">
            <div class="row-header">
                <h2 id="artist-trending-title" class="row-title">Most Trending Songs</h2>
            </div>

            <div class="scroll-row" id="artist-trending-tracks">
                <div class="music-card card-placeholder container-hover-effect">
                    <div class="card-image-box"><div class="ivids-loader"><img src="svg/loader.svg" alt="Loading" class="ivids-loader-img"></div></div>
                    <div class="card-info-box"><div class="card-title"></div><div class="card-artist"></div></div>
                </div>
                <div class="music-card card-placeholder container-hover-effect">
                    <div class="card-image-box"><div class="ivids-loader"><img src="svg/loader.svg" alt="Loading" class="ivids-loader-img"></div></div>
                    <div class="card-info-box"><div class="card-title"></div><div class="card-artist"></div></div>
                </div>
                <div class="music-card card-placeholder container-hover-effect">
                    <div class="card-image-box"><div class="ivids-loader"><img src="svg/loader.svg" alt="Loading" class="ivids-loader-img"></div></div>
                    <div class="card-info-box"><div class="card-title"></div><div class="card-artist"></div></div>
                </div>
                <div class="music-card card-placeholder container-hover-effect">
                    <div class="card-image-box"><div class="ivids-loader"><img src="svg/loader.svg" alt="Loading" class="ivids-loader-img"></div></div>
                    <div class="card-info-box"><div class="card-title"></div><div class="card-artist"></div></div>
                </div>
            </div>
        </div>
    </div>
</div>
