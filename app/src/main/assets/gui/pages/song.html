<!-- Song Detail Page -->
<div class="song-page page-container fade-in">

   <!-- Hero Section -->
   <div class="song-hero">
      <div class="hero-bg">
         <div class="blob blob-1"></div>
         <div class="blob blob-2"></div>
         <div class="blob blob-3"></div>
      </div>

      <div class="song-hero-content">
         <!-- Cover Art -->
         <div class="song-cover-wrapper">
            <div class="ivids-loader poster-loader" id="song-cover-loader"></div>
            <img id="song-cover" class="song-cover" src="" alt="" style="opacity:0">
         </div>

         <!-- Info -->
         <div class="song-info">
            <div class="song-meta-row">
               <span class="song-type-label" data-i18n="song">Song</span>
            </div>
            <h1 id="song-title" class="song-title">—</h1>
            <div class="song-sub-info">
               <button id="song-artist-link" class="btn btn-ghost song-artist-btn">
                  <span id="song-artist" class="song-artist">—</span>
               </button>
               <span class="song-dot">·</span>
               <button id="song-album-link" class="btn btn-ghost song-album-btn">
                  <span id="song-album" class="song-album">—</span>
               </button>
               <span class="song-dot">·</span>
               <span id="song-year" class="song-year">—</span>
               <span class="song-dot">·</span>
               <span id="song-duration" class="song-duration">—</span>
            </div>

            <!-- Actions -->
            <div class="song-actions">
               <button id="song-play-btn" class="btn btn-primary">
                  <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                     <path d="M8 5v14l11-7z" />
                  </svg>
                  <span data-i18n="play">Play</span>
               </button>
               <button id="song-play-next-btn" class="btn btn-secondary">
                  <span class="btn-icon">⏭</span>
                  <span data-i18n="play_next">Play Next</span>
               </button>
               <button id="song-add-to-queue-btn" class="btn btn-secondary">
                  <span class="btn-icon">➕</span>
                  <span data-i18n="add_to_queue">Add to Queue</span>
               </button>
               <button id="song-add-to-playlist-btn" class="btn btn-secondary">
                  <span class="btn-icon">📂</span>
                  <span data-i18n="add_to_playlist">Add to Playlist</span>
               </button>
               <button id="song-save-btn" class="btn btn-secondary">
                  <img src="svg/download.svg" alt="" class="btn-icon" style="filter:brightness(0) invert(1);">
                  <span data-i18n="download_track">Save</span>
               </button>
               <button class="btn btn-secondary"
                  onclick="Router.loadPage('artist', { name: document.getElementById('song-artist')?.textContent })">
                  <span data-i18n="view_artist">View Artist</span>
               </button>
            </div>
         </div>
      </div>
   </div>

   <!-- Metadata Tags -->
   <div class="song-tags-section">
      <div id="song-genres" class="song-genres-container">
         <!-- Genre chips, BPM badge and explicit badge injected by JS -->
      </div>
   </div>

   <!-- 1. Albums from Artist Row -->
   <div id="song-albums-row" class="row-scroll-wrapper is-hidden">
      <div class="row-header">
         <h2 id="song-albums-title" class="row-title" data-i18n="albums_from_artist">Albums</h2>
      </div>
      <div class="scroll-row" id="song-albums-tracks"></div>
   </div>

   <!-- 2. Most Popular Songs from Artist Row -->
   <div id="song-popular-row" class="row-scroll-wrapper is-hidden">
      <div class="row-header">
         <h2 id="song-popular-title" class="row-title" data-i18n="popular_songs_from_artist">Most Popular Songs</h2>
      </div>
      <div class="scroll-row" id="song-popular-tracks"></div>
   </div>

   <!-- 3. Most Trending Songs from Artist Row -->
   <div id="song-trending-row" class="row-scroll-wrapper is-hidden">
      <div class="row-header">
         <h2 id="song-trending-title" class="row-title" data-i18n="trending_songs_from_artist">Most Trending Songs</h2>
      </div>
      <div class="scroll-row" id="song-trending-tracks"></div>
   </div>

</div>
